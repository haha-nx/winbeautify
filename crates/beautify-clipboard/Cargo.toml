[package]
name = "beautify-clipboard"
description = "Event-driven clipboard history for WinBeautify, backed by SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
beautify-core.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
serde.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
