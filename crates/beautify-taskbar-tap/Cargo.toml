[package]
name = "beautify-taskbar-tap"
description = "XAML diagnostics TAP loaded into explorer.exe to repaint the Windows 11 22H2+ taskbar for WinBeautify."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `rlib` so the host crate can share the protocol definitions; `cdylib` is the
# artifact that actually gets injected into explorer.
crate-type = ["rlib", "cdylib"]

[dependencies]
windows-core = "0.62"
windows-numerics.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Graphics_Effects",
    "UI_Composition",
]
