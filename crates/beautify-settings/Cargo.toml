[package]
name = "beautify-settings"
description = "Native settings window for WinBeautify."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
beautify-core.workspace = true
# The Direct2D/DirectWrite primitives and the text engine are already written
# and tested there; duplicating them here would mean two text caches and two
# sets of font fallbacks to keep in step.
beautify-widget.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_DirectWrite",
    # The window paints its own chrome and hit-tests its own frame, so it needs
    # the GDI pieces those stand on: `PAINTSTRUCT`, the work area a maximised
    # window is clamped to, and the cursor calls. DWM rounds the corners.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
