<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinBeautify 设置</title>
    <link rel="stylesheet" href="./src/shared/tokens.css" />
    <link rel="stylesheet" href="./src/settings/settings.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <img src="./icons/32x32.png" alt="" class="brand-mark" />
          <span class="brand-name">WinBeautify</span>
        </div>
        <div class="save-state" id="save-state"></div>
        <div class="window-controls">
          <button class="win-btn" id="win-min" type="button" title="最小化">
            <svg viewBox="0 0 12 12"><path d="M2 5.7h8v.9H2z" /></svg>
          </button>
          <button class="win-btn close" id="win-close" type="button" title="关闭">
            <svg viewBox="0 0 12 12">
              <path d="m2.6 1.7 7.7 7.7-.9.9-7.7-7.7z" />
              <path d="m9.4 1.7.9.9-7.7 7.7-.9-.9z" />
            </svg>
          </button>
        </div>
      </header>

      <div class="body">
        <nav class="sidebar" id="sidebar" aria-label="设置分类"></nav>
        <main class="content" id="content"></main>
      </div>
    </div>

    <script type="module" src="./src/settings/main.ts"></script>
  </body>
</html>
