<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinBeautify 小组件</title>
    <link rel="stylesheet" href="./src/shared/tokens.css" />
    <link rel="stylesheet" href="./src/widget/widget.css" />
  </head>
  <body>
    <!--
      The widget bar. One launcher button drives the flyout; the audio
      component shows lyrics when idle and transport controls on hover.
    -->
    <div class="bar" id="bar">
      <button
        class="launcher"
        id="launcher"
        type="button"
        title="任务清单与剪贴板"
        aria-label="打开任务清单与剪贴板"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="3.2" rx="1.6" />
          <rect x="1.5" y="6.9" width="13" height="3.2" rx="1.6" opacity="0.62" />
          <rect x="1.5" y="11.3" width="13" height="2.2" rx="1.1" opacity="0.38" />
        </svg>
        <span class="badge" id="badge" hidden></span>
      </button>

      <div class="audio" id="audio" hidden>
        <div class="cover">
          <img id="artwork" alt="" hidden />
          <div class="cover-fallback" id="cover-fallback" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5c.35 0 .69.07 1 .2V6.2l9-1.8v10.6a2.5 2.5 0 1 1-2.5-2.5c.35 0 .69.07 1 .2V7.6l-6 1.2z"
              />
            </svg>
          </div>
        </div>

        <div class="slot">
          <div class="lyric" id="lyric"></div>
          <div class="controls" id="controls">
            <button type="button" data-action="previous" aria-label="上一首">
              <svg viewBox="0 0 16 16">
                <path d="M4 3h1.6v10H4z" />
                <path d="M13 3.4v9.2L6.4 8z" />
              </svg>
            </button>
            <button type="button" data-action="toggle" class="primary" aria-label="播放或暂停">
              <svg viewBox="0 0 16 16" id="icon-play" hidden>
                <path d="M4.6 3.1 12.4 8l-7.8 4.9z" />
              </svg>
              <svg viewBox="0 0 16 16" id="icon-pause">
                <path d="M4.4 3h2.4v10H4.4zM9.2 3h2.4v10H9.2z" />
              </svg>
            </button>
            <button type="button" data-action="next" aria-label="下一首">
              <svg viewBox="0 0 16 16">
                <path d="M10.4 3H12v10h-1.6z" />
                <path d="M3 3.4v9.2L9.6 8z" />
              </svg>
            </button>
          </div>
        </div>

        <canvas class="spectrum" id="spectrum" width="1" height="1"></canvas>
      </div>
    </div>

    <script type="module" src="./src/widget/main.ts"></script>
  </body>
</html>
