[package]
name = "winbeautify"
description = "WinBeautify - a low-overhead Windows desktop beautifier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "winbeautify"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
beautify-core.workspace = true
beautify-taskbar.workspace = true
beautify-media.workspace = true
beautify-clipboard.workspace = true
beautify-todo.workspace = true
beautify-widget.workspace = true
# The settings centre and the snipper are native windows of this process now,
# not webviews; both are driven through the `Host` traits they define.
beautify-flyout.workspace = true
beautify-settings.workspace = true
beautify-snip.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    # The single-instance guard names a mutex and an event, and both of those
    # take a `SECURITY_ATTRIBUTES` parameter.
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
